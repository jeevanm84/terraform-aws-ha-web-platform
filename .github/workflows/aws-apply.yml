name: AWS Apply

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Variable profile to deploy
        required: true
        type: choice
        options: [learning, ha]
        default: learning
      confirmation:
        description: Type APPLY to confirm a billable deployment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Plan and apply saved plan
    if: inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-apply

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5

      - name: Initialize remote state
        working-directory: environments/learning
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Create saved plan
        working-directory: environments/learning
        run: terraform plan -input=false -lock-timeout=5m -out=deployment.tfplan -var-file="${{ inputs.profile }}.tfvars.example"

      - name: Apply exactly the reviewed plan
        working-directory: environments/learning
        run: terraform apply -input=false -lock-timeout=5m deployment.tfplan
