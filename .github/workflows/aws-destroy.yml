name: AWS Destroy

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Variable profile currently deployed
        required: true
        type: choice
        options: [learning, ha]
        default: learning
      confirmation:
        description: Type DESTROY to confirm removal
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Destroy learning platform
    if: inputs.confirmation == 'DESTROY'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-apply

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5

      - name: Initialize remote state
        working-directory: environments/learning
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Preview destroy
        working-directory: environments/learning
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan -var-file="${{ inputs.profile }}.tfvars.example"

      - name: Destroy exactly the saved plan
        working-directory: environments/learning
        run: terraform apply -input=false -lock-timeout=5m destroy.tfplan
