name: AWS Plan

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Variable profile to plan
        required: true
        type: choice
        options: [learning, ha]
        default: learning

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-plan
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Review AWS plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-plan

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5

      - name: Initialize remote state
        working-directory: environments/learning
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Create plan
        working-directory: environments/learning
        run: terraform plan -input=false -lock-timeout=5m -var-file="${{ inputs.profile }}.tfvars.example"
