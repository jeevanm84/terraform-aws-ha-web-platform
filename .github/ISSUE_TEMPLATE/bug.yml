name: Bug report
description: Report reproducible behavior in the code or guide.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include AWS credentials, account IDs, secrets, or Terraform state.
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: 1.14.5
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      options: [Tool setup, Offline validation, State bootstrap, OIDC bootstrap, Plan, Apply, Verification, Destroy]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact command and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
